# Stage 10 — local/private deployment.
# Copy `.env.example` to `.env` and fill secrets before `docker compose up --build`.
services:
  app:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
    restart: unless-stopped

  scheduler:
    build: .
    entrypoint: ["python", "-m", "scheduler", "--loop", "300"]
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
    depends_on:
      - app
    restart: unless-stopped
